server:
  port: 8086

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/amazon_microservices
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    function:
      definition: orderCreatedConsumer;paymentFailedConsumer;orderCreatedDltConsumer

    stream:
      bindings:

        orderCreatedConsumer-in-0:
          destination: order-created
          group: inventory-service-group
          consumer:
            concurrency: 3
            max-attempts: 3

        paymentFailedConsumer-in-0:
          destination: payment-failed
          group: inventory-payment-failed-group

        orderCreatedDltConsumer-in-0:
          destination: order-created.DLT
          group: inventory-dlt-group

      kafka:
        binder:
          brokers: localhost:9092

        bindings:
          orderCreatedConsumer-in-0:
            consumer:
              enable-dlq: true
              dlq-name: order-created.DLT

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.stream: DEBUG
    org.springframework.kafka: DEBUG
