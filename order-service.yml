server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/amazon_microservices
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    function:
      definition: paymentFailedConsumer

    stream:
      bindings:
        orderCreated-out-0:
          destination: order-created

        paymentFailedConsumer-in-0:
          destination: payment-failed
          group: order-payment-failed-group

      kafka:
        binder:
          brokers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
